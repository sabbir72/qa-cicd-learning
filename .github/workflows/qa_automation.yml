name: QA Automation

# ==========================================
# WORKFLOW TRIGGERS
# ==========================================
on:
  # Developer repository থেকে automatic trigger
  repository_dispatch:
    types:
      - run-qa-tests

  # GitHub Actions থেকে manual trigger
  workflow_dispatch:
    inputs:
      base_url:
        description: "Application Base URL"
        required: true
        default: "https://developer-demo-app.vercel.app/"

# ==========================================
# JOBS
# ==========================================
jobs:
  # ==========================================
  # 1. SMOKE TEST
  # ==========================================
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest

    # ----------------------------------------
    # Application URL
    # ----------------------------------------
    env:
      BASE_URL: ${{ github.event.client_payload.base_url || inputs.base_url }}

    steps:
      # --------------------------------------
      # Checkout QA repository
      # --------------------------------------
      - name: Checkout QA repository
        uses: actions/checkout@v4

      # --------------------------------------
      # Setup Python
      # --------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # --------------------------------------
      # Install Python dependencies
      # --------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # --------------------------------------
      # Install Playwright
      # --------------------------------------
      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      # --------------------------------------
      # Show QA information
      # --------------------------------------
      - name: Show QA Information
        run: |
          echo "===================================="
          echo "QA AUTOMATION STARTED"
          echo "===================================="
          echo "Base URL: $BASE_URL"
          echo "Source Repo: ${{ github.event.client_payload.source_repo }}"
          echo "Commit: ${{ github.event.client_payload.commit_sha }}"
          echo "Branch: ${{ github.event.client_payload.branch }}"
          echo "===================================="

      # # --------------------------------------
      # # Run Smoke Tests
      # # --------------------------------------
