name: QA Automation

on:
  push:
    branches:
      - main

  repository_dispatch:
    types:
      - run-qa-tests

  workflow_dispatch:
    inputs:
      base_url:
        description: "Application Base URL"
        required: true
        default: "https://developer-demo-app.vercel.app/"

jobs:
  # ==========================================
  # SMOKE TEST
  # ==========================================

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ github.event.client_payload.base_url || inputs.base_url }}

    steps:
      # 1. Checkout QA repository
      - name: Checkout QA repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Install Playwright browser
      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      # 5. Show test information
      - name: Show QA Information
        run: |
          echo "===================================="
          echo "QA AUTOMATION STARTED"
          echo "===================================="
          echo "Base URL: $BASE_URL"
          echo "Source Repo: ${{ github.event.client_payload.source_repo }}"
          echo "Commit: ${{ github.event.client_payload.commit_sha }}"
          echo "Branch: ${{ github.event.client_payload.branch }}"
          echo "===================================="

      # 6. Run Smoke Tests
      - name: Run Smoke Tests
        run: |
          pytest tests/smoke \
            -m smoke \
            --junitxml=smoke-report.xml

      # 7. Upload Smoke Report
      - name: Upload Smoke Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: smoke-report.xml
