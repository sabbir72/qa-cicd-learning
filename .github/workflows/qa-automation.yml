name: QA Automation

on:
  repository_dispatch:
    types:
      - run-qa-tests

  workflow_dispatch:

jobs:
  smoke:
    name: Smoke Tests
    runs-on: ubuntu-latest

    env:
      BASE_URL: ${{ github.event.client_payload.base_url || inputs.base_url }}

    steps:
      - name: Checkout QA repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: |
          playwright install --with-deps chromium

      - name: Show QA Information
        run: |
          echo "===================================="
          echo "QA AUTOMATION STARTED"
          echo "===================================="
          echo "Base URL: $BASE_URL"
          echo "Source Repo: ${{ github.event.client_payload.source_repo }}"
          echo "Commit: ${{ github.event.client_payload.commit_sha }}"
          echo "Branch: ${{ github.event.client_payload.branch }}"
          echo "===================================="

      - name: Run Smoke Tests
        run: |
          pytest tests/smoke \
            -m smoke \
            --junitxml=smoke-report.xml

      - name: Upload Smoke Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: smoke-report.xml
